name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: tests, determinism, and published numbers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Test suite
        run: make test

      - name: Datasets regenerate byte-for-byte
        run: |
          make data
          git diff --exit-code -- data/ \
            || { echo "::error::regenerated data differs from the committed CSVs"; exit 1; }

      - name: Baselines and difficulty floor
        run: make baseline

      - name: Agent scored against the floor
        run: make report

      - name: Recovery ambiguity
        run: make ambiguity

      - name: Decision journals
        run: make audit

      - name: Audit hash chain
        run: make verify-audit

      - name: Exception queue
        run: make exceptions

      - name: Adversarial and robustness suite
        run: python -m pytest tests/test_adversarial.py -q
        env:
          PYTHONPATH: src

      - name: Demo page
        run: make demo

      - uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: runs/demo/index.html
          if-no-files-found: error

      - name: README metrics table is current
        run: |
          make stats
          git diff --exit-code -- README.md \
            || { echo "::error::README stats are stale -- run 'make stats' and commit"; exit 1; }
